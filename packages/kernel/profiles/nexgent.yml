# Nexgent default product profile (step 1).
#
# Ordered plugin rows; patches (cordis.patch.yml form) address rows by `id`.
# Product defaults migrated from PR #4
# runtime/packages/bundle/nexgent-app/cordis.patch.yml:
#   agent-default-model -> agents.model / agents.thinking
#   llm-pi-ai.providers.mimo -> llm.config
#   system-prompt.personaPrefix / personaSuffix -> agents.systemPrompt
# Credentials stay in the credential service (NEXGENT_API_KEY); no secret
# ever appears in a profile. PR #4 rows for DSH-only features (execution
# ledger sidecar, architecture trials, workflow tools, DeepSeek account,
# telemetry) have no step-1 equivalent and are not carried over.

- id: credentials
  name: '@nexgent/kernel/credentials'

- id: workspace
  name: '@nexgent/workspace'

- id: session
  name: '@nexgent/session'

- id: llm
  name: '@nexgent/llm'
  config:
    provider: mimo
    displayName: MiMo
    endpoint: https://token-plan-cn.xiaomimimo.com/v1
    model: mimo-v2.6-pro
    apiKeyCredential: NEXGENT_API_KEY
    thinking: 'off'
    timeoutMs: 180000
    streamIdleTimeoutMs: 180000
    maxRetries: 0
    maxTokens: 4096
    contextWindow: 128000
    compat:
      thinkingFormat: deepseek
      supportsReasoningEffort: false
      supportsDeveloperRole: false
      supportsStore: false
      maxTokensField: max_tokens

- id: tools
  name: '@nexgent/kernel/tools'

- id: approvals
  name: '@nexgent/kernel/approvals'

- id: agents
  name: '@nexgent/kernel/agents'
  config:
    model: mimo-v2.6-pro
    thinking: 'off'
    maxTokens: 4096
    modelTimeoutMs: 180000
    streamIdleTimeoutMs: 180000
    systemPrompt:
      persona: >-
        You are Nexgent, a general task agent using the {{model}} model.
        Complete the user's task with the available materials and tools.
        Choose direct work, delegation or a workflow according to the task.
        Verify actual deliverables, explain unresolved requirements, and preserve useful work for subsequent turns.
      suffix: Your project working directory is {{cwd}}.

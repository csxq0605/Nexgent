[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexgent-workbench"
version = "0.1.0"
description = "Optional artifact-based data reconciliation task domain and benchmark"
requires-python = ">=3.11"
dependencies = ["nexgent>=0.9.0", "jsonschema>=4.22,<5"]
license = "MIT"

[project.entry-points."nexgent.domains"]
workbench = "nexgent_workbench.plugin:domain_pack"

[project.entry-points."nexgent.task_benchmarks"]
workbench = "nexgent_workbench.plugin:benchmark_adapter"

[tool.setuptools.packages.find]
where = ["src"]

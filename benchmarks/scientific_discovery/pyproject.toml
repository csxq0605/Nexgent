[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexgent-scientific-discovery"
version = "0.1.0"
description = "Scientific discovery benchmark plugin for the domain-neutral Nexgent RSI framework"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["nexgent>=0.8.0", "numpy>=1.26", "scipy>=1.12"]

[project.entry-points."nexgent.benchmarks"]
scientific_discovery = "nexgent_scientific_discovery:ScientificDiscoveryBenchmark"

[tool.setuptools.packages.find]
where = ["src"]

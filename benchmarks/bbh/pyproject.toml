[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexgent-bbh"
version = "0.1.0"
description = "Pinned BIG-Bench Hard two-task adapter for the Nexgent RSI runtime"
requires-python = ">=3.11"
dependencies = ["nexgent>=0.8.0"]
license = "MIT"

[project.entry-points."nexgent.benchmarks"]
bbh = "nexgent_bbh:BigBenchHardBenchmark"

[project.scripts]
nexgent-bbh-download = "nexgent_bbh.data:main"

[tool.setuptools.packages.find]
where = ["src"]

name: Nexgent

# Pushes to the integration branches, and every pull request. A pushed PR
# branch used to run twice (push + pull_request) for the same commit.
on:
  push:
    branches: [nexgent-app, main]
  pull_request:
  workflow_dispatch:

# A newer push to a PR supersedes the older run. Runs on the integration
# branches are never cancelled, so every merge commit gets a result (two
# merges in a row used to leave the first one "cancelled").
concurrency:
  group: nexgent-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

      # Step-1 acceptance: scripted provider, run → kill → resume, on both platforms.
      - run: node scripts/accept-step1.mjs --out accept-step1.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accept-step1-${{ matrix.os }}
          path: accept-step1.json
          if-no-files-found: ignore

      # Step-2 acceptance, headless + desktop layers (scripted provider). Items not
      # implemented yet are reported as not-implemented and the summary says fail;
      # --allow-not-ready keeps that from failing the job (exit 2 → 0) until the
      # checks land. Remove the flag when step 2 is accepted (round 4).
      - run: node scripts/accept-step2.mjs --layer headless,desktop --allow-not-ready --out accept-step2.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accept-step2-${{ matrix.os }}
          path: accept-step2.json
          if-no-files-found: ignore

      # Desktop smoke (step-2 round 1): Playwright's Electron driver opens an
      # empty Electron window. Linux runs it under xvfb; Electron's SUID
      # sandbox helper needs root ownership there (Ubuntu restricts
      # unprivileged user namespaces), as Electron's docs prescribe.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: node node_modules/electron/install.js
      - if: runner.os == 'Linux'
        run: |
          sandbox="$(node -p "require('path').join(require('path').dirname(require.resolve('electron/package.json')), 'dist', 'chrome-sandbox')")"
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"
          xvfb-run -a node scripts/accept-common/desktop-smoke.mjs
      - if: runner.os == 'Windows'
        run: node scripts/accept-common/desktop-smoke.mjs

      # The PowerShell launcher runs a write-file task against the scripted model server.
      - if: runner.os == 'Windows'
        run: node scripts/accept-common/ps1-smoke.mjs

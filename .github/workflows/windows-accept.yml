name: Windows acceptance

# Step-6 acceptance on Windows (user 2026-10-11: CI must not run on its own;
# one manual Windows run per step acceptance): accept-step6 headless, desktop
# and experiment layers (H18 re-runs step 5's headless items, D01–D23 are
# steps 2–5's desktop items as a regression, E01–E04 the scripted pilot
# rehearsal) and the desktop package's tests (UI e2e included). Step 6 closes
# on the pilot (user 2026-10-15), so there is no real-model step here.
# Manual only, from the Actions tab. Uploads the summary.
on:
  workflow_dispatch:

concurrency:
  group: windows-accept
  cancel-in-progress: false

jobs:
  windows:
    name: windows-latest
    runs-on: windows-latest
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          submodules: false
      - uses: pnpm/action-setup@v4
        timeout-minutes: 5
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        timeout-minutes: 10
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 10
      - uses: actions/cache@v4
        timeout-minutes: 10
        with:
          path: ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: node node_modules/electron/install.js
        timeout-minutes: 10
      - run: pnpm build
        timeout-minutes: 10

      - name: accept-step6 headless + desktop + experiment
        id: hd
        timeout-minutes: 120
        env:
          DEBUG: pw:browser
        run: node scripts/accept-step6.mjs --layer headless,desktop,experiment --out accept-step6-hd.json
      - name: desktop package tests (UI e2e)
        id: desktop
        timeout-minutes: 15
        if: always() && steps.hd.conclusion != 'skipped'
        env:
          DEBUG: pw:browser
        # One file at a time: e2e.spec.ts and members-e2e.spec.ts each launch Electron, and on
        # Windows two instances at once collide on the single-instance lock.
        run: pnpm --filter @nexgent/desktop exec vitest run --testTimeout=60000 --no-file-parallelism

      - name: print summaries
        if: always()
        timeout-minutes: 5
        run: |
          for f in accept-step6-hd.json; do
            [ -f "$f" ] || continue
            node -e "const s=require('./'+process.argv[1]); console.log(process.argv[1], s.result); for (const c of s.checks) console.log(c.id, c.status, String(c.detail ?? '').slice(0, 300)); console.log(JSON.stringify({realModel: s.realModel, failures: s.failures}))" "$f"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        timeout-minutes: 10
        with:
          name: windows-accept
          path: |
            accept-step6-hd.json
          if-no-files-found: ignore

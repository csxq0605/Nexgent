name: Windows acceptance

# Step-5 acceptance on Windows (user 2026-10-11: CI must not run on its own;
# one manual Windows run per step acceptance): accept-step5 headless and
# desktop layers (H19 re-runs step 4's headless items, D01–D18 are steps 2–4's
# desktop items as a regression), the desktop package's tests (UI e2e
# included) and, when asked, the real-model layer (R08: the step-5 real run
# on Windows with pwsh as the shell tool).
# Manual only, from the Actions tab. The real-model step reads the repository
# secret NEXGENT_API_KEY; without it the script exits 2 and the step fails
# rather than reporting a pass. Uploads the summaries and the real run's
# records (no key: the script reads it from the environment only).
on:
  workflow_dispatch:
    inputs:
      real:
        description: Also run the real-model layer (history, feedback, two improvement jobs, gate, next task; about 4.5 USD)
        type: boolean
        default: false
      spent_usd:
        description: Estimated cost of earlier real runs in this series, comma-separated USD
        type: string
        default: ''

concurrency:
  group: windows-accept
  cancel-in-progress: false

jobs:
  windows:
    name: windows-latest
    runs-on: windows-latest
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          submodules: false
      - uses: pnpm/action-setup@v4
        timeout-minutes: 5
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        timeout-minutes: 10
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 10
      - uses: actions/cache@v4
        timeout-minutes: 10
        with:
          path: ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: node node_modules/electron/install.js
        timeout-minutes: 10
      - run: pnpm build
        timeout-minutes: 10

      - name: accept-step5 headless + desktop
        id: hd
        timeout-minutes: 80
        env:
          DEBUG: pw:browser
        run: node scripts/accept-step5.mjs --out accept-step5-hd.json
      - name: desktop package tests (UI e2e)
        id: desktop
        timeout-minutes: 15
        if: always() && steps.hd.conclusion != 'skipped'
        env:
          DEBUG: pw:browser
        # One file at a time: e2e.spec.ts and members-e2e.spec.ts each launch Electron, and on
        # Windows two instances at once collide on the single-instance lock.
        run: pnpm --filter @nexgent/desktop exec vitest run --testTimeout=60000 --no-file-parallelism
      - name: accept-step5 real (R01–R07 on Windows, i.e. R08)
        id: real
        timeout-minutes: 180
        if: always() && steps.hd.conclusion != 'skipped' && inputs.real
        env:
          NEXGENT_API_KEY: ${{ secrets.NEXGENT_API_KEY }}
          SPENT_USD: ${{ inputs.spent_usd }}
        run: |
          node -e "const v=(process.env.SPENT_USD||'').split(',').map(s=>s.trim()).filter(Boolean).map(Number); if(v.some(n=>!(n>=0))) throw new Error('spent_usd must be comma-separated numbers'); require('fs').writeFileSync('spent.json', JSON.stringify(v))"
          node scripts/accept-step5.mjs --layer real --budget-usd 15 --spent spent.json --work-dir "$RUNNER_TEMP/real" --out accept-step5-real.json

      - name: print summaries
        if: always()
        timeout-minutes: 5
        run: |
          for f in accept-step5-hd.json accept-step5-real.json; do
            [ -f "$f" ] || continue
            node -e "const s=require('./'+process.argv[1]); console.log(process.argv[1], s.result); for (const c of s.checks) console.log(c.id, c.status, String(c.detail ?? '').slice(0, 300)); console.log(JSON.stringify({realModel: s.realModel, failures: s.failures}))" "$f"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        timeout-minutes: 10
        with:
          name: windows-accept
          path: |
            accept-step5-hd.json
            accept-step5-real.json
            ${{ runner.temp }}/real/real
          if-no-files-found: ignore

name: Windows acceptance

# Step-2 acceptance on Windows (user 2026-10-11: run Windows before merging
# into main): accept-step2 headless and desktop layers, the desktop package's
# tests (UI e2e included), and the real-model layer (R06: R01–R05 on Windows
# with pwsh as the shell tool). Never runs on its own: by hand from the Actions
# tab once this file is on the default branch, or, before that, by a push to
# the test-and-CI branch that changes this file or .github/windows-accept.run.
# The real-model step reads the repository secret NEXGENT_API_KEY; without it
# the script exits 2 and the step fails rather than reporting a pass. Uploads
# summaries and the real run's records (no key: the script reads it from the
# environment only).
on:
  push:
    branches: [claude/test-ci-ns3s7s]
    paths:
      - .github/workflows/windows-accept.yml
      - .github/windows-accept.run
  workflow_dispatch:

concurrency:
  group: windows-accept
  cancel-in-progress: false

jobs:
  windows:
    name: windows-latest
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: node node_modules/electron/install.js
      - run: pnpm build

      - name: accept-step2 headless + desktop
        id: hd
        env:
          DEBUG: pw:browser
        run: node scripts/accept-step2.mjs --out accept-step2-hd.json
      - name: desktop package tests (UI e2e)
        id: desktop
        if: always() && steps.hd.conclusion != 'skipped'
        env:
          DEBUG: pw:browser
        run: pnpm --filter @nexgent/desktop exec vitest run --testTimeout=60000
      - name: accept-step2 real (R01–R07, R06 on Windows)
        id: real
        if: always() && steps.hd.conclusion != 'skipped'
        env:
          NEXGENT_API_KEY: ${{ secrets.NEXGENT_API_KEY }}
        run: |
          echo '[0.1526, 0.2125, 0.1409, 0.1842]' > spent.json
          node scripts/accept-step2.mjs --layer real --budget-usd 15 --spent spent.json --work-dir "$RUNNER_TEMP/real" --out accept-step2-real.json

      - name: print summaries
        if: always()
        run: |
          for f in accept-step2-hd.json accept-step2-real.json; do
            [ -f "$f" ] && node -e "const s=require('./'+process.argv[1]); console.log(process.argv[1], s.result); for (const c of s.checks) console.log(c.id, c.status, String(c.detail ?? '').slice(0, 300)); console.log(JSON.stringify({realModel: s.realModel, failures: s.failures}))" "$f"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-accept
          path: |
            accept-step2-hd.json
            accept-step2-real.json
            ${{ runner.temp }}/real/real
          if-no-files-found: ignore

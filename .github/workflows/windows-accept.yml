name: Windows acceptance

# Windows acceptance (user 2026-10-11: CI must not run on its own): the
# accept-step3 headless and desktop layers (D01–D10 are step 2's desktop items
# as a regression) and the desktop package's tests (UI e2e included).
# accept-step4/5/6 left with the old improvement and gate code. No real-model
# step. Manual only, from the Actions tab. Uploads the summary.
on:
  workflow_dispatch:

concurrency:
  group: windows-accept
  cancel-in-progress: false

jobs:
  windows:
    name: windows-latest
    runs-on: windows-latest
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          submodules: false
      - uses: pnpm/action-setup@v4
        timeout-minutes: 5
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        timeout-minutes: 10
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 10
      - uses: actions/cache@v4
        timeout-minutes: 10
        with:
          path: ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: node node_modules/electron/install.js
        timeout-minutes: 10
      - run: pnpm build
        timeout-minutes: 10

      - name: accept-step3 headless + desktop
        id: hd
        timeout-minutes: 60
        env:
          DEBUG: pw:browser
        run: node scripts/accept-step3.mjs --layer headless,desktop --out accept-step3-hd.json
      - name: desktop package tests (UI e2e)
        id: desktop
        timeout-minutes: 15
        if: always() && steps.hd.conclusion != 'skipped'
        env:
          DEBUG: pw:browser
        # One file at a time: e2e.spec.ts and members-e2e.spec.ts each launch Electron, and on
        # Windows two instances at once collide on the single-instance lock.
        run: pnpm --filter @nexgent/desktop exec vitest run --testTimeout=60000 --no-file-parallelism

      - name: print summaries
        if: always()
        timeout-minutes: 5
        run: |
          for f in accept-step3-hd.json; do
            [ -f "$f" ] || continue
            node -e "const s=require('./'+process.argv[1]); console.log(process.argv[1], s.result); for (const c of s.checks) console.log(c.id, c.status, String(c.detail ?? '').slice(0, 300)); console.log(JSON.stringify({realModel: s.realModel, failures: s.failures}))" "$f"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        timeout-minutes: 10
        with:
          name: windows-accept
          path: |
            accept-step3-hd.json
          if-no-files-found: ignore
      # When the desktop tests fail, keep the e2e projects' session records and configs for diagnosis.
      - uses: actions/upload-artifact@v4
        if: failure() && steps.desktop.conclusion == 'failure'
        timeout-minutes: 10
        with:
          name: windows-desktop-e2e-records
          path: |
            ~/AppData/Local/Temp/nexgent-*e2e-*/**/*.jsonl
            ~/AppData/Local/Temp/nexgent-*e2e-*/**/*.json
            !~/AppData/Local/Temp/nexgent-*e2e-*/**/desktop-data/**
          if-no-files-found: ignore
          retention-days: 7

name: Scientific agent checks
on: [push, pull_request, workflow_dispatch]
env:
  QT_QPA_PLATFORM: offscreen
  NEXGENT_API_KEY: test-key-for-testing
  NEXGENT_BASE_URL: http://localhost:8080/v1
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Linux Qt libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - run: python -m pip install -e '.[dev]'
      - name: Scientific product and durable runtime acceptance
        run: python -m pytest tests -q

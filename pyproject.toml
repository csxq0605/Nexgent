[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexgent"
version = "0.9.0"
description = "A general task agent runtime with durable execution, artifacts, tools, memory, and pluggable benchmarks"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["openai>=1.0", "requests>=2.31", "beautifulsoup4>=4.12,<5", "python-dotenv>=1.0", "PyQt6>=6.8,<7", "jsonschema>=4.22,<5", "openpyxl>=3.1,<4", "xlsxwriter>=3.2,<4", "formulas[excel]>=1.3,<2"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.5"]
dsh = ["mcp>=1.28,<2", "uvicorn>=0.30,<1"]

[project.scripts]
nexgent = "nexgent.cli:main"
nexgent-gui = "nexgent.ui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nexgent = ["agents/seeds/*.py", "agents/seeds/*.json", "ui/assets/*.svg", "ui/assets/*.png", "kernel/*.mjs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["provider: real configured model calls, explicitly invoked", "research: benchmark and improver experiments"]
